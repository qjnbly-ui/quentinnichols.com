    const voiceSendBtn = document.getElementById("voice-send-button");
    const voiceCancelBtn = document.getElementById("voice-cancel-button");
    let audioUnlocked = false;
    let unlockAttempted = false;
    let mediaRecorder = null;

    let recordingChunks = [];
    let recordingStream = null;
    let recordMimeType = "";

    function setAudioStatus(text) {
      if (!audioStatus) return;
      audioStatus.textContent = String(text || "");
    }

    function aiConfirm({ title = "Confirm", message = "", confirmLabel = "OK", cancelLabel = "Cancel" } = {}) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "qapp-modal-overlay";
        overlay.innerHTML = `
          <section class="qapp-modal" role="dialog" aria-modal="true" aria-labelledby="aiModalTitle">
            <div class="qapp-modal-header">
              <h2 id="aiModalTitle"></h2>
              <p></p>
            </div>
            <div class="qapp-modal-actions">
              <button class="qapp-modal-cancel" type="button"></button>
              <button class="qapp-modal-confirm" type="button"></button>
            </div>
          </section>
        `;
        overlay.querySelector("h2").textContent = title;
        overlay.querySelector("p").textContent = message;
        overlay.querySelector(".qapp-modal-cancel").textContent = cancelLabel;
        overlay.querySelector(".qapp-modal-confirm").textContent = confirmLabel;

        function close(result) {
          document.removeEventListener("keydown", onKeydown);
          overlay.remove();
          resolve(result);
        }

        function onKeydown(event) {
          if (event.key === "Escape") close(false);
          if (event.key === "Enter") close(true);
        }

        overlay.querySelector(".qapp-modal-cancel").addEventListener("click", () => close(false));
        overlay.querySelector(".qapp-modal-confirm").addEventListener("click", () => close(true));
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) close(false);
        });
        document.addEventListener("keydown", onKeydown);
        document.body.appendChild(overlay);
        setTimeout(() => overlay.querySelector(".qapp-modal-confirm")?.focus(), 0);
      });
    }

    function setVoiceRecordingUi(isRecording) {
      if (!voiceBtn || !voiceSendBtn || !voiceCancelBtn) return;
      voiceBtn.hidden = isRecording;
      voiceSendBtn.hidden = !isRecording;
      voiceCancelBtn.hidden = !isRecording;
    }

    async function unlockAudioPlayback() {
      if (audioUnlocked) return;
      unlockAttempted = true;
      try {
        if (!unlockedAudio) {
          unlockedAudio = new Audio(
            "data:audio/wav;base64,UklGRlQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
          );
          unlockedAudio.playsInline = true;
        }
        unlockedAudio.muted = true;
        await unlockedAudio.play();
        unlockedAudio.pause();
        unlockedAudio.currentTime = 0;
        unlockedAudio.muted = false;
        audioUnlocked = true;
      } catch (_err) {
        // Keep graceful fallback behavior if unlock is blocked.
      }
    }

    function createLinkedText(text) {
      const container = document.createElement("span");
      const markdownLink = /\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g;
      const urlPattern = /\bhttps?:\/\/[^\s]+/g;

      function prepareLink(link, href) {
        const routeMatch = String(href || "").match(/^\/app\/?#([a-z-]+)$/i);
        if (routeMatch && window.parent && window.parent !== window) {
          link.addEventListener("click", (event) => {
            event.preventDefault();
            window.parent.postMessage({ type: "qapp:set-route", route: routeMatch[1] }, window.location.origin);
          });
          return;
        }
        if (/^\/app\/?#/i.test(String(href || ""))) {
          link.target = "_top";
        }
      }

      let lastIndex = 0;
      let match;

      while ((match = markdownLink.exec(text)) !== null) {
        const [full, label, href] = match;
        if (match.index > lastIndex) {
          container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        }

        const link = document.createElement("a");
        link.href = href;
        link.textContent = label;
        prepareLink(link, href);
        if (/^https?:\/\//i.test(href)) {
          link.rel = "noopener";
          link.target = "_blank";
        }
        container.appendChild(link);
        lastIndex = match.index + full.length;
      }

      if (lastIndex < text.length) {
        container.appendChild(document.createTextNode(text.slice(lastIndex)));
      }

      const childNodes = Array.from(container.childNodes);
      container.textContent = "";
      childNodes.forEach((node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          const parts = node.textContent.split(urlPattern);
          const matches = node.textContent.match(urlPattern) || [];
          parts.forEach((part, idx) => {
            if (part) container.appendChild(document.createTextNode(part));
            const url = matches[idx];
            if (url) {
              const link = document.createElement("a");
              link.href = url;
              link.textContent = "link";
              link.rel = "noopener";
              link.target = "_blank";
              container.appendChild(link);
            }
          });
        } else {
          container.appendChild(node);
        }
      });

      return container;
    }

    function cleanForSpeech(text) {
      const withoutMarkdownLinks = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g, "$1");
      const withoutUrls = withoutMarkdownLinks.replace(/\bhttps?:\/\/[^\s]+/g, "");
      const expandAges = withoutUrls.replace(/\b(\d+)-year-old\b/gi, "$1 year old");
      const softHyphens = expandAges.replace(/(\d)-(\d)/g, "$1 to $2");
      return softHyphens.replace(/\s+/g, " ").trim();
    }

    function formatActionDate(value) {
      if (!value) return "Time not set";
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return "Time not set";
      return date.toLocaleString(undefined, {
        weekday: "short",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit",
      });
    }

    function toDateTimeLocal(value) {
      if (!value) return "";
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return "";
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    }

    function fromDateTimeLocal(value) {
      if (!value) return "";
      const date = new Date(value);
      return Number.isFinite(date.getTime()) ? date.toISOString() : "";
    }

    function actionSummary(action) {
      const payload = action?.payload || {};
      if (action?.type === "create_calendar_event") {
        return `${payload.title || "Untitled event"} · ${formatActionDate(payload.startsAt)}`;
      }
      if (action?.type === "update_people_memory") {
        const draft = payload.draft || {};
        const people = [
          ...(Array.isArray(draft.people) ? draft.people.map((person) => person.name).filter(Boolean) : []),
          ...(Array.isArray(draft.possiblePeople) ? draft.possiblePeople.filter((person) => Number(person.confidence || 0) >= 0.75).map((person) => person.name).filter(Boolean) : []),
        ];
        const memoryCount = Array.isArray(draft.memoryCards) ? draft.memoryCards.length : 0;
        const reminderCount = Array.isArray(draft.reminders) ? draft.reminders.length : 0;
        const pieces = [];
        if (people.length) pieces.push(`Profiles: ${people.join(", ")}`);
        if (memoryCount) pieces.push(`${memoryCount} memor${memoryCount === 1 ? "y" : "ies"}`);
        if (reminderCount) pieces.push(`${reminderCount} follow-up${reminderCount === 1 ? "" : "s"}`);
        return pieces.join(" · ") || "Conversation review";
      }
      if (action?.type === "create_task") {
        return `${payload.title || "Untitled task"}${payload.dueAt ? ` · Due ${formatActionDate(payload.dueAt)}` : ""}`;
      }
      return "Suggested action";
    }

    function actionConfirmLabel(action) {
      if (action?.type === "create_calendar_event") return "Review Calendar";
      if (action?.type === "update_people_memory") return "Review Conversation";
      if (action?.type === "create_task") return "Review Task";
      return "Confirm";
    }

    function actionDoneLabel(action) {
      if (action?.type === "create_calendar_event") return "Added";
      if (action?.type === "update_people_memory") return "Saved Conversation";
      if (action?.type === "create_task") return "Added";
      return "Done";
    }

    function actionViewLabel(action) {
      if (action?.type === "create_calendar_event") return "View in Calendar";
      if (action?.type === "update_people_memory") return "View in People";
      if (action?.type === "create_task") return "View Tasks";
      return "View";
    }

    function getMessageActions(message) {
      if (Array.isArray(message?.actions)) return message.actions;
      return message?.action ? [message.action] : [];
    }

    function getAction(messageIndex, actionIndex = 0) {
      return getMessageActions(messages[messageIndex])[actionIndex] || null;
    }

    function renderActionDetails(action) {
      const payload = action?.payload || {};
      const draft = payload.draft || {};
      const details = document.createElement("div");
      details.className = "ai-action-details";

      if (action?.type === "update_people_memory") {
        const cards = Array.isArray(draft.memoryCards) ? draft.memoryCards.slice(0, 4) : [];
        cards.forEach((card) => {
          const item = document.createElement("span");
          item.textContent = `${card.label || "Memory"}: ${card.value || ""}`;
          details.appendChild(item);
        });
      } else if (action?.type === "create_calendar_event") {
        if (payload.description) {
          const item = document.createElement("span");
          item.textContent = payload.description;
          details.appendChild(item);
        }
        if (payload.allDay) {
          const item = document.createElement("span");
          item.textContent = "All day";
          details.appendChild(item);
        }
      } else if (action?.type === "create_task") {
        if (payload.description) {
          const item = document.createElement("span");
          item.textContent = payload.description;
          details.appendChild(item);
        }
        if (payload.priority) {
          const item = document.createElement("span");
          item.textContent = `Priority: ${payload.priority}`;
          details.appendChild(item);
        }
      }

      return details.childElementCount ? details : null;
    }

    function peopleActionReviewText(action) {
      const draft = action?.payload?.draft || {};
      const people = [
        ...(Array.isArray(draft.people) ? draft.people.map((person) => person.name).filter(Boolean) : []),
        ...(Array.isArray(draft.possiblePeople) ? draft.possiblePeople.filter((person) => Number(person.confidence || 0) >= 0.75).map((person) => person.name).filter(Boolean) : []),
      ];
      const memoryCards = Array.isArray(draft.memoryCards) ? draft.memoryCards : [];
      const reminders = Array.isArray(draft.reminders) ? draft.reminders : [];
      return [
        people.length ? `Profiles: ${people.join(", ")}` : "Profiles: none confidently matched",
        memoryCards.length ? `Memory cards:\n${memoryCards.map((card) => `- ${card.label || "Memory"}: ${card.value || ""}`).join("\n")}` : "Memory cards: none",
        reminders.length ? `Follow-ups:\n${reminders.map((reminder) => `- ${reminder.title || "Follow up"}`).join("\n")}` : "Follow-ups: none",
      ].join("\n\n");
    }

    function reviewPeopleAction(action) {

            <div class="qapp-modal-header">
              <h2 id="aiReviewTitle">Review Conversation</h2>
              <p>This will save as a conversation entry, attach selected memories, and refresh the profile overview.</p>
            </div>
            <div class="qapp-modal-fields">
              <label>
                <span>Conversation note</span>
                <textarea data-review-note rows="6"></textarea>
              </label>

                <span>Detected details</span>

        function close(result) {
          document.removeEventListener("keydown", onKeydown);
          overlay.remove();
          resolve(result);
        }

        function onKeydown(event) {
          if (event.key === "Escape") close(null);
        }

        overlay.querySelector(".qapp-modal-cancel").addEventListener("click", () => close(null));
        overlay.querySelector(".qapp-modal-confirm").addEventListener("click", () => {
          const note = String(noteField.value || "").trim();

        overlay.addEventListener("click", (event) => {

        });
        document.addEventListener("keydown", onKeydown);
        document.body.appendChild(overlay);
        setTimeout(() => noteField.focus(), 0);

    }

    function reviewTaskAction(action) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "qapp-modal-overlay";
        overlay.innerHTML = `
          <section class="qapp-modal" role="dialog" aria-modal="true" aria-labelledby="aiTaskReviewTitle">

              <h2 id="aiTaskReviewTitle">Review Task</h2>

                <span>Title</span>

              <button class="qapp-modal-cancel" type="button">Cancel</button>

          </section>
        `;
        const titleField = overlay.querySelector("[data-review-title]");
        const dueField = overlay.querySelector("[data-review-due]");
        const descriptionField = overlay.querySelector("[data-review-description]");
        titleField.value = action?.payload?.title || "";
        dueField.value = toDateTimeLocal(action?.payload?.dueAt);
        descriptionField.value = action?.payload?.description || "";

        function close(result) {
          document.removeEventListener("keydown", onKeydown);
          overlay.remove();
          resolve(result);
        }

        function onKeydown(event) {
          if (event.key === "Escape") close(null);
        }

        overlay.querySelector(".qapp-modal-cancel").addEventListener("click", () => close(null));
        overlay.querySelector(".qapp-modal-confirm").addEventListener("click", () => {
          const title = String(titleField.value || "").trim();
          if (!title) {
            titleField.focus();
            return;
          }
          close({
            title,
            dueAt: fromDateTimeLocal(dueField.value) || null,
            description: String(descriptionField.value || "").trim(),
          });
        });
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) close(null);
        });
        document.addEventListener("keydown", onKeydown);
        document.body.appendChild(overlay);
        setTimeout(() => titleField.focus(), 0);
      });
    }

    function reviewCalendarAction(action) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "qapp-modal-overlay";
        overlay.innerHTML = `
          <section class="qapp-modal" role="dialog" aria-modal="true" aria-labelledby="aiCalendarReviewTitle">
            <div class="qapp-modal-header">
              <h2 id="aiCalendarReviewTitle">Review Calendar Event</h2>
              <p>This will add an event only after you save it here.</p>
            </div>
            <div class="qapp-modal-fields">
              <label>
                <span>Title</span>
                <input data-review-title type="text">
              </label>
              <label>
                <span>Starts</span>
                <input data-review-start type="datetime-local">
              </label>
              <label>
                <span>Notes</span>
                <textarea data-review-description rows="5"></textarea>
              </label>
            </div>
            <div class="qapp-modal-actions">
              <button class="qapp-modal-cancel" type="button">Cancel</button>
              <button class="qapp-modal-confirm" type="button">Save Event</button>
            </div>
          </section>
        `;
        const titleField = overlay.querySelector("[data-review-title]");
        const startField = overlay.querySelector("[data-review-start]");
        const descriptionField = overlay.querySelector("[data-review-description]");
        titleField.value = action?.payload?.title || "";
        startField.value = toDateTimeLocal(action?.payload?.startsAt);
        descriptionField.value = action?.payload?.description || "";

        function close(result) {
          document.removeEventListener("keydown", onKeydown);
          overlay.remove();
          resolve(result);
        }

        function onKeydown(event) {
          if (event.key === "Escape") close(null);
        }

        overlay.querySelector(".qapp-modal-cancel").addEventListener("click", () => close(null));
        overlay.querySelector(".qapp-modal-confirm").addEventListener("click", () => {
          const title = String(titleField.value || "").trim();
          const startsAt = fromDateTimeLocal(startField.value);
          if (!title) {
            titleField.focus();
            return;
          }
          if (!startsAt) {
            startField.focus();
            return;
          }
          close({
            title,
            startsAt,
            description: String(descriptionField.value || "").trim(),
          });
        });
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) close(null);
        });
        document.addEventListener("keydown", onKeydown);
        document.body.appendChild(overlay);
        setTimeout(() => titleField.focus(), 0);
      });
    }

    function renderActionCard(action, messageIndex, actionIndex) {
      if (!action) return null;
      const payload = action.payload || {};
      const card = document.createElement("div");
      card.className = `ai-action-card ai-action-card--${action.status || "draft"}`;

      const title = document.createElement("strong");
      title.textContent = action.label || "Suggested action";
      const summary = document.createElement("p");
      summary.textContent = actionSummary(action);
      card.appendChild(title);
      card.appendChild(summary);

      const details = renderActionDetails(action);
      if (details) card.appendChild(details);

      if (action.status === "done") {
        const done = document.createElement("span");
        done.className = "ai-action-status";
        done.textContent = actionDoneLabel(action);
        card.appendChild(done);
        const controls = document.createElement("div");
        controls.className = "ai-action-controls";
        const view = document.createElement("button");
        view.type = "button";
        view.dataset.actionViewMessage = String(messageIndex);
        view.dataset.actionViewIndex = String(actionIndex);
        view.textContent = actionViewLabel(action);
        controls.appendChild(view);
        card.appendChild(controls);
      } else if (action.status === "saving") {
        const saving = document.createElement("span");
        saving.className = "ai-action-status";
        saving.textContent = "Saving...";
        card.appendChild(saving);
      } else if (action.status === "dismissed") {
        const dismissed = document.createElement("span");
        dismissed.className = "ai-action-status";
        dismissed.textContent = "Dismissed";
        card.appendChild(dismissed);
      } else if (action.status === "error") {
        const error = document.createElement("span");
        error.className = "ai-action-status ai-action-status--error";
        error.textContent = action.error || "Could not apply";
        card.appendChild(error);
      } else {
        const controls = document.createElement("div");
        controls.className = "ai-action-controls";
        const apply = document.createElement("button");
        apply.type = "button";
        apply.dataset.actionApplyMessage = String(messageIndex);
        apply.dataset.actionApplyIndex = String(actionIndex);
        apply.textContent = actionConfirmLabel(action);
        const dismiss = document.createElement("button");
        dismiss.type = "button";
        dismiss.dataset.actionDismissMessage = String(messageIndex);
        dismiss.dataset.actionDismissIndex = String(actionIndex);
        dismiss.textContent = "Dismiss";
        controls.appendChild(apply);
        controls.appendChild(dismiss);
        card.appendChild(controls);
      }

      return card;
    }

    function render(messages) {
      log.innerHTML = "";
      messages.forEach((msg, index) => {
        const row = document.createElement("div");
        row.className = `ai-bubble ai-bubble--${msg.role}`;
        const textEl = document.createElement("p");
        textEl.className = "ai-bubble-text";
        if (msg.role === "assistant" && msg.text && msg.text !== "Thinking...") {
          textEl.appendChild(createLinkedText(msg.text));
        } else {
          textEl.textContent = msg.text;
        }
        row.appendChild(textEl);

        if (msg.role === "assistant") {
          getMessageActions(msg).forEach((action, actionIndex) => {
            const actionCard = renderActionCard(action, index, actionIndex);
            if (actionCard) row.appendChild(actionCard);
          });
        }

        if (msg.role === "assistant" && msg.text && msg.text !== "Thinking...") {
          const controls = document.createElement("div");
          controls.className = "ai-bubble-controls";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ai-tts";
          btn.dataset.index = String(index);
          btn.textContent = "Listen";
          const stopBtn = document.createElement("button");
          stopBtn.type = "button";
          stopBtn.className = "ai-tts-stop";
          stopBtn.dataset.index = String(index);
          stopBtn.textContent = "Stop";
          stopBtn.hidden = true;
          const progress = document.createElement("progress");
          progress.className = "ai-tts-progress";
          progress.max = 1;
          progress.value = 0;
          progress.hidden = true;

          controls.appendChild(btn);
          controls.appendChild(stopBtn);
          controls.appendChild(progress);
          row.appendChild(controls);
        }

        log.appendChild(row);
      });
      log.scrollTop = log.scrollHeight;
    }

    function loadMessages() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveMessages(messages) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    const messages = loadMessages();
    render(messages);

    async function sendMessage(payloadMessages) {
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: payloadMessages }),
      });

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Request failed");
      }

      const data = await response.json();
      return {
        reply: data.reply || "Sorry, I couldn't generate a response.",
        actions: Array.isArray(data.actions) ? data.actions : [],
      };
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const result = String(reader.result || "");
          resolve(result.includes(",") ? result.split(",").pop() : result);
        };
        reader.onerror = () => reject(new Error("Could not read audio"));
        reader.readAsDataURL(blob);
      });
    }

    async function sendVoiceTurn(blob) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 60000);
      const audio = await blobToBase64(blob);
      let response;
      try {
        response = await fetch("/api/voice", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            audio,
            mimeType: blob.type || "audio/webm",
            messages: messages.map((msg) => ({
              role: msg.role,
              content: msg.text,
            })),
          }),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timeout);
      }

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(errorText || "Voice request failed");
      }

      const data = await response.json();
      return {
        text: String(data?.text || "").trim(),
        reply: String(data?.reply || "").trim(),
      };
    }

    async function submitUserMessage(text) {
      const trimmed = String(text || "").trim();
      if (!trimmed) return;
      document.body.classList.add("ai-chat-open");
      messages.push({ role: "user", text: trimmed });
      const payloadMessages = messages.map((msg) => ({
        role: msg.role,
        content: msg.text,
      }));
      const pendingIndex = messages.push({ role: "assistant", text: "Thinking..." }) - 1;
      render(messages);
      saveMessages(messages);
      input.value = "";
      input.focus();

      try {
        const result = await sendMessage(payloadMessages);
        messages[pendingIndex].text = result.reply;
        if (result.actions?.length) messages[pendingIndex].actions = result.actions;
      } catch (err) {
        messages[pendingIndex].text = "Sorry, something went wrong. Please try again.";
      }

      render(messages);
      saveMessages(messages);
    }

    async function applyAction(messageIndex, actionIndex = 0) {
      const message = messages[messageIndex];
      const action = getAction(messageIndex, actionIndex);
      if (!message || !action) return;

      if (action.type === "update_people_memory") {
        const reviewed = await reviewPeopleAction(action);
        if (!reviewed) return;
        action.payload.note = reviewed.note;
        if (action.payload.draft?.interaction) {
          action.payload.draft.interaction.notes = reviewed.note;
        }
      } else if (action.type === "create_task") {
        const reviewed = await reviewTaskAction(action);
        if (!reviewed) return;
        action.payload.title = reviewed.title;
        action.payload.dueAt = reviewed.dueAt;
        action.payload.description = reviewed.description;
      } else if (action.type === "create_calendar_event") {
        const reviewed = await reviewCalendarAction(action);
        if (!reviewed) return;
        const previousStart = action.payload.startsAt ? new Date(action.payload.startsAt).getTime() : NaN;
        const previousEnd = action.payload.endsAt ? new Date(action.payload.endsAt).getTime() : NaN;
        const durationMs = Number.isFinite(previousStart) && Number.isFinite(previousEnd)
          ? Math.max(previousEnd - previousStart, 30 * 60000)
          : 60 * 60000;
        const reviewedStartMs = new Date(reviewed.startsAt).getTime();
        action.payload.title = reviewed.title;
        action.payload.startsAt = reviewed.startsAt;
        action.payload.endsAt = new Date(reviewedStartMs + durationMs).toISOString();
        action.payload.description = reviewed.description;
      }

      action.status = "saving";
      render(messages);
      saveMessages(messages);

      try {
        const response = await fetch("/api/ai-actions", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ action }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload?.error || "Action could not be saved.");
        }
        action.status = "done";
        action.result = payload;
        if (payload?.event) {
          action.eventId = payload.event.id || "";
          message.text = `Added "${action.payload?.title || "the event"}" to your calendar.`;
        } else if (payload?.task) {
          action.taskId = payload.task.id || "";
          message.text = `Added "${action.payload?.title || "the task"}" to Tasks.`;
        } else if (payload?.people?.length) {
          action.personIds = payload.people.map((person) => person.id).filter(Boolean);
          const names = payload.people.map((person) => person.name).filter(Boolean).join(", ");
          const overviewErrors = payload.people.map((person) => person.overviewError).filter(Boolean);
          message.text = overviewErrors.length
            ? `Saved the conversation entry for ${names || "the selected profile"}, but the overview refresh needs another try.`
            : `Saved the conversation entry for ${names || "the selected profile"} and refreshed the overview.`;
        } else {
          message.text = "Saved.";
        }
      } catch (err) {
        action.status = "error";
        action.error = err?.message || "Action could not be saved.";
      }

      render(messages);
      saveMessages(messages);
    }

    function dismissAction(messageIndex, actionIndex = 0) {
      const action = getAction(messageIndex, actionIndex);
      if (!action) return;
      action.status = "dismissed";
      render(messages);
      saveMessages(messages);
    }

    function viewAction(messageIndex, actionIndex = 0) {
      const action = getAction(messageIndex, actionIndex);
      if (!action) return;
      const message = action.type === "update_people_memory"
        ? {
          type: "qapp:view-person-profile",
          personId: action.personIds?.[0] || action.result?.people?.[0]?.id || "",
        }
        : action.type === "create_task"
        ? {
          type: "qapp:set-route",
          route: "tasks",
        }
        : {
          type: "qapp:view-calendar-event",
          eventId: action.eventId || "",
          startsAt: action.payload?.startsAt || "",
        };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      } else {
        window.location.href = "/app/";
      }
    }

    const openBtn = document.getElementById("open-chat");
    const closeBtn = document.getElementById("close-chat");

    if (openBtn) {
      openBtn.addEventListener("click", () => {
        document.body.classList.add("ai-chat-open");
        setTimeout(() => {
          input.focus();
          input.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 150);
      });
    }

    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        document.body.classList.remove("ai-chat-open");
        document.body.classList.remove("ai-keyboard-open");
      });
    }

    input.addEventListener("focus", () => {
      document.body.classList.add("ai-chat-open");
      document.body.classList.add("ai-keyboard-open");
      setTimeout(() => {
        input.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 150);
    });
    input.addEventListener("blur", () => {
      setTimeout(() => {
        document.body.classList.remove("ai-keyboard-open");
      }, 140);
    });

    function syncKeyboardClass() {
      if (!window.visualViewport || window.innerWidth > 720) return;
      const keyboardLikelyOpen = window.visualViewport.height < window.innerHeight * 0.82;
      if (keyboardLikelyOpen) {
        document.body.classList.add("ai-keyboard-open");
      } else if (document.activeElement !== input) {
        document.body.classList.remove("ai-keyboard-open");
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncKeyboardClass);
      window.visualViewport.addEventListener("scroll", syncKeyboardClass);
    }

    async function requestSpeech(text, signal) {
      const response = await fetch("/api/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: cleanForSpeech(text) }),
        signal,
      });

      if (!response.ok) {
        const errorText = await response.text();
        let parsed = null;
        try {
          parsed = JSON.parse(errorText);
        } catch (_err) {}
        const message = parsed?.error || errorText || "TTS request failed";
        const details = parsed?.details || parsed?.attempts?.[0]?.details || "";
        throw new Error(details ? `${message}: ${details}` : message);
      }

      const blob = await response.blob();
      return URL.createObjectURL(blob);
    }

    let activePlayback = null;

    function playSpeechQueue(text, controls) {
      const cleaned = cleanForSpeech(text);
      if (!cleaned) return null;
      const maxChunk = 1100;
      const sentences = cleaned.match(/[^.!?]+[.!?]*/g) || [cleaned];
      const chunks = [];
      let buffer = "";
      let stopped = false;
      let currentAudio = null;
      let currentUrl = null;
      let currentFetch = null;
      let nextFetch = null;

      function flushBuffer(nextText) {
        if ((buffer + nextText).length <= maxChunk) {
          buffer += nextText;
          return;
        }
        if (buffer) chunks.push(buffer.trim());
        buffer = nextText;
      }

      function splitByComma(sentence) {
        const parts = sentence.split(/(,\s+|;\s+|:\s+)/);
        let acc = "";
        for (let i = 0; i < parts.length; i += 2) {
          const segment = parts[i] || "";
          const punctuation = parts[i + 1] || "";
          const piece = `${segment}${punctuation}`;
          if (!piece.trim()) continue;
          if (piece.length > maxChunk) {
            const words = piece.split(/\s+/);
            let wordBuf = "";
            words.forEach((word) => {
              const next = wordBuf ? `${wordBuf} ${word}` : word;
              if (next.length > maxChunk) {
                if (wordBuf) chunks.push(wordBuf.trim());
                wordBuf = word;
              } else {
                wordBuf = next;
              }
            });
            if (wordBuf) chunks.push(wordBuf.trim());
          } else {
            flushBuffer(piece);
          }
        }
      }

      sentences.forEach((sentence) => {
        if (sentence.length > maxChunk) {
          splitByComma(sentence);
        } else {
          flushBuffer(sentence);
        }
      });
      if (buffer) chunks.push(buffer.trim());

      const stop = () => {
        stopped = true;
        if (currentFetch?.abort) currentFetch.abort();
        if (nextFetch?.abort) nextFetch.abort();
        currentFetch = null;
        nextFetch = null;
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
        if (currentUrl) {
          URL.revokeObjectURL(currentUrl);
          currentUrl = null;
        }
        controls.listen.textContent = "Listen";
        controls.stop.hidden = true;
        controls.progress.hidden = true;
        controls.progress.value = 0;
        setAudioStatus("Idle");
      };

      controls.listen.textContent = "Playing";
      controls.stop.hidden = false;
      controls.progress.hidden = false;
      setAudioStatus("Loading...");

      (async () => {
        const startFetch = (chunk) => {
          const controller = new AbortController();
          return {
            abort: () => controller.abort(),
            promise: requestSpeech(chunk, controller.signal),
          };
        };

        let index = 0;
        if (chunks.length > 0) {
          currentFetch = startFetch(chunks[0]);
        }

        while (!stopped && index < chunks.length && currentFetch) {
          let audioUrl;
          try {
            audioUrl = await currentFetch.promise;
            setAudioStatus("Playing");
          } catch (err) {
            if (stopped) break;
            throw err;
          }

          if (stopped) {
            URL.revokeObjectURL(audioUrl);
            break;
          }

          if (index + 1 < chunks.length) {
            nextFetch = startFetch(chunks[index + 1]);
          }

          currentUrl = audioUrl;
          await new Promise((resolve, reject) => {
            const audio = unlockedAudio || new Audio();
            audio.src = audioUrl;
            audio.playsInline = true;
            audio.muted = false;
            currentAudio = audio;
            const onTimeUpdate = () => {
              if (Number.isFinite(audio.duration) && audio.duration > 0) {
                controls.progress.value = audio.currentTime / audio.duration;
              }
            };
            const cleanup = () => {
              audio.removeEventListener("timeupdate", onTimeUpdate);
              URL.revokeObjectURL(audioUrl);
              controls.progress.value = 0;
              if (currentAudio === audio) currentAudio = null;
              currentUrl = null;
            };
            audio.addEventListener("timeupdate", onTimeUpdate);
            audio.addEventListener("ended", () => {
              cleanup();
              resolve();
            });
            audio.addEventListener("error", () => {
              cleanup();
              reject(new Error("Audio playback failed"));
            });
            audio.play().catch(reject);
          });

          currentFetch = nextFetch;
          nextFetch = null;
          index += 1;
        }
      })()
        .catch((err) => {
          if (stopped) return;
          const message = err?.message || "Audio playback failed";
          controls.listen.textContent = "Error";
          controls.listen.title = message;
          setAudioStatus("Error");
          setTimeout(() => {
            controls.listen.textContent = "Listen";
            controls.listen.title = "";
            if (!activePlayback) setAudioStatus("Idle");
          }, 2400);
        })
        .finally(() => {
          stop();
        });

      return { stop };
    }

    async function playLatestAssistantReply(index) {
      await unlockAudioPlayback();
      const row = log.children[index];
      const controlsWrap = row?.querySelector(".ai-bubble-controls");
      const controls = {
        listen: controlsWrap?.querySelector(".ai-tts"),
        stop: controlsWrap?.querySelector(".ai-tts-stop"),
        progress: controlsWrap?.querySelector(".ai-tts-progress"),
      };
      if (!controls.listen || !controls.stop || !controls.progress) return;
      if (activePlayback) {
        activePlayback.stop();
        activePlayback = null;
      }
      controls.listen.textContent = "Playing";
      activePlayback = playSpeechQueue(messages[index].text, controls);
    }

    log.addEventListener("click", async (event) => {
      const btn = event.target.closest(".ai-tts");
      if (!btn) return;
      const index = Number(btn.dataset.index);
      const msg = messages[index];
      if (!msg || msg.role !== "assistant") return;

      if (activePlayback) {
        activePlayback.stop();
        activePlayback = null;
      }

      const controls = {
        listen: btn,
        stop: btn.parentElement.querySelector(".ai-tts-stop"),
        progress: btn.parentElement.querySelector(".ai-tts-progress"),
      };

      btn.disabled = true;
      btn.textContent = "Loading...";
      try {
        await unlockAudioPlayback();
        btn.textContent = "Playing";
        activePlayback = playSpeechQueue(msg.text, controls);
      } catch (err) {
        btn.textContent = "Listen";
      } finally {
        btn.disabled = false;
      }
    });

    log.addEventListener("click", (event) => {
      const stopBtn = event.target.closest(".ai-tts-stop");
      if (!stopBtn) return;
      if (activePlayback) {
        activePlayback.stop();
        activePlayback = null;
      }
    });

    log.addEventListener("click", async (event) => {
      const applyButton = event.target.closest("[data-action-apply-message]");
      if (applyButton) {
        await applyAction(
          Number(applyButton.dataset.actionApplyMessage),
          Number(applyButton.dataset.actionApplyIndex || 0)
        );
        return;
      }

      const dismissButton = event.target.closest("[data-action-dismiss-message]");
      if (dismissButton) {
        dismissAction(
          Number(dismissButton.dataset.actionDismissMessage),
          Number(dismissButton.dataset.actionDismissIndex || 0)
        );
        return;
      }

      const viewButton = event.target.closest("[data-action-view-message]");
      if (viewButton) {
        viewAction(
          Number(viewButton.dataset.actionViewMessage),
          Number(viewButton.dataset.actionViewIndex || 0)
        );
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      await submitUserMessage(input.value);
    });

    async function ensureRecordingStream() {
      if (recordingStream) return recordingStream;
      recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return recordingStream;
    }

    function releaseRecordingStream() {
      if (!recordingStream) return;
      recordingStream.getTracks().forEach((track) => track.stop());
      recordingStream = null;
    }

    async function startRecording() {
      if (recording) return;
      if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
        setAudioStatus("Mic unsupported");
        return;
      }
      try {
        await ensureRecordingStream();
        recordingChunks = [];
        recordMimeType = MediaRecorder.isTypeSupported("audio/mp4")
          ? "audio/mp4"
          : MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
          ? "audio/webm;codecs=opus"
          : "";
        mediaRecorder = recordMimeType ? new MediaRecorder(recordingStream, { mimeType: recordMimeType }) : new MediaRecorder(recordingStream);
        mediaRecorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) recordingChunks.push(event.data);
        });
        mediaRecorder.start(250);
        recording = true;
        setVoiceRecordingUi(true);
        setAudioStatus("Listening...");
      } catch (err) {
        setVoiceRecordingUi(false);
        setAudioStatus(`Mic error: ${err?.message || "permission denied or unavailable"}`);
      }
    }

    function stopRecorderCapture() {
      if (!recording || !mediaRecorder) return;
      recording = false;
      setVoiceRecordingUi(false);

      const stoppedRecorder = mediaRecorder;
      const stoppedMimeType = stoppedRecorder.mimeType || recordMimeType || "audio/webm";
      const done = new Promise((resolve) => {
        const timeout = setTimeout(() => {
          resolve(null);
        }, 5000);
        stoppedRecorder.addEventListener(
          "stop",
          () => {
            clearTimeout(timeout);
            const blob = new Blob(recordingChunks, { type: stoppedMimeType });
            resolve(blob);
          },
          { once: true }
        );
      });
      stoppedRecorder.stop();
      mediaRecorder = null;
      releaseRecordingStream();
      return done;
    }

    async function stopRecordingAndSend() {
      const done = stopRecorderCapture();
      if (!done) return;
      setAudioStatus("Thinking...");

      try {
        const blob = await done;
        if (!blob || blob.size === 0) {
          setAudioStatus("No audio captured");
          return;
        }
        const { text, reply } = await sendVoiceTurn(blob);
        if (!text) {
          setAudioStatus("No speech detected");
          return;
        }
        messages.push({ role: "user", text });
        const assistantIndex = messages.push({ role: "assistant", text: reply || "Sorry, something went wrong. Please try again." }) - 1;
        render(messages);
        saveMessages(messages);
        await playLatestAssistantReply(assistantIndex);
      } catch (err) {
        setAudioStatus(`Voice error: ${err?.message || "request failed"}`);
        releaseRecordingStream();
      }
    }

    async function cancelRecording() {
      const done = stopRecorderCapture();
      if (!done) return;
      setAudioStatus("Canceled");
      try {
        await done;
      } catch (_err) {}
      recordingChunks = [];
      setTimeout(() => {
        if (!recording) setAudioStatus("");
      }, 1200);
    }

    if (voiceBtn) {
      voiceBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        await startRecording();
      });
    }

    if (voiceSendBtn) {
      voiceSendBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        await unlockAudioPlayback();
        await stopRecordingAndSend();
      });
    }

    if (voiceCancelBtn) {
      voiceCancelBtn.addEventListener("click", async (event) => {
        event.preventDefault();
        await cancelRecording();
      });
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (recording && mediaRecorder) {
          try {
            mediaRecorder.stop();
          } catch (_err) {}
          mediaRecorder = null;
          recording = false;
          setVoiceRecordingUi(false);
        }
        releaseRecordingStream();
      }
    });

    clearBtn.addEventListener("click", async () => {
      const confirmed = await aiConfirm({
        title: "Clear Chat",
        message: "Clear this chat from your device?",
        confirmLabel: "Clear",
      });
      if (!confirmed) return;
      messages.length = 0;
      saveMessages(messages);
      render(messages);
    });
  </script>
  <script src="/assets/nav.js"></script>
