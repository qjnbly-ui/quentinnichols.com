<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <style>
    .portal-page {
      min-height: 100vh;
      background: #000000;
      color: var(--text);
    }

    .portal-main {
      width: min(720px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 7rem 0 3rem;
    }

    .portal-card {
      padding: 1.8rem;
      border-radius: 28px;
      border: 1px solid var(--surface-border);
      background: rgba(12, 12, 12, 0.94);
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.42);
    }

    .portal-kicker {
      margin: 0 0 0.85rem;
      font-size: 0.76rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .portal-title {
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
      color: var(--text);
    }

    .portal-copy {
      margin: 1rem 0 0;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .portal-links {
      display: grid;
      gap: 0.9rem;
      margin-top: 1.7rem;
    }

    .portal-link {
      display: block;
      padding: 1rem 1.05rem;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      background: #111111;
      color: var(--text);
      text-decoration: none;
      font-size: 1rem;
      line-height: 1.6;
    }

    .portal-link span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .portal-actions {
      margin-top: 1.7rem;
      padding-top: 1.3rem;
      border-top: 1px solid var(--surface-border);
    }

    .portal-button {
      min-height: 50px;
      padding: 0 1rem;
      border: 1px solid var(--surface-border-strong);
      border-radius: 999px;
      background: #f5f2ea;
      color: #111111;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      .portal-main {
        width: min(100% - 1rem, 720px);
        padding-top: 6.5rem;
      }

      .portal-card {
        padding: 1.35rem;
        border-radius: 24px;
      }
    }
  </style>
</head>

<body class="portal-page">
  <nav class="site-nav" aria-label="Site">
    <div class="nav-shell">
      <details class="nav-menu">
        <summary aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <div class="nav-menu-panel">
          <a href="/">Home</a>
          <a href="/photography/">Photography</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/contact/">Contact</a>
          <a href="https://shop.quentinnichols.com/" target="_blank" rel="noopener">Shop</a>
        </div>
      </details>
      <a class="nav-logo" href="/">
        <img src="/assets/Watermark (1) copy.png" alt="Quentin Nichols Oregon">
      </a>
      <div class="nav-spacer" aria-hidden="true"></div>
    </div>
  </nav>

  <main class="portal-main">
    <section class="portal-card">
      <p class="portal-kicker">Private Access</p>
      <h1 class="portal-title">Portal</h1>
      <p class="portal-copy">Access available systems.</p>

      <div class="portal-links">
        <a class="portal-link" href="/AI/">
          AI
          <span>Site-grounded chat and private tools.</span>
        </a>

        <a class="portal-link" href="/blog/private/">
          Private Blog
          <span>Personal writing and unpublished work.</span>
        </a>
      </div>

      <div class="portal-actions">
        <button class="portal-button" onclick="logout()">Logout</button>
      </div>
    </section>
  </main>

  <script src="/assets/auth.js"></script>
  <script src="/assets/nav.js"></script>

  <script>
    async function checkAuth() {
      const session = await window.siteAuth.getSession();

      if (!session) {
        window.location.href = "/login/";
      }
    }

    async function logout() {
      await window.siteAuth.logout();
      window.location.href = "/";
    }

    checkAuth().catch((error) => {
      console.log("Portal auth check failed:", error);
      window.location.href = "/login/";
    });
  </script>

</body>
</html>
