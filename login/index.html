<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/Favicon32.png" />
<meta name="robots" content="noindex, nofollow">
  <title>Private Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <nav class="site-nav" aria-label="Site">
    <div class="nav-shell">
      <details class="nav-menu">
        <summary aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <div class="nav-menu-panel">
          <a href="/">Home</a>
          <a href="/photography/">Photography</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/contact/">Contact</a>
        </div>
      </details>
      <a class="nav-logo" href="/">
        <img src="/assets/NEWLOGO.png" alt="Quentin Nichols">
      </a>
      <div class="nav-spacer" aria-hidden="true"></div>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <p class="auth-kicker">Private Access</p>
      <h1 class="auth-title">Login</h1>
      <p class="auth-copy">Sign in to enter the private side of the site.</p>

      <form class="auth-form" id="login-form">
        <label class="auth-label" for="email">
          Email
          <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </label>

        <label class="auth-label" for="password">
          Password
          <input class="auth-input" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>

        <button class="auth-button" id="login-button" type="submit">Login</button>
        <div class="auth-turnstile-wrap" id="auth-captcha-field">
          <span class="auth-label-text">Security Check</span>
          <div id="auth-turnstile"></div>
          <p class="auth-turnstile-note">Complete this check before signing in.</p>
        </div>
        <p class="auth-message" id="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/nav.js"></script>
  <script src="/assets/login.js"></script>
</body>
</html>
