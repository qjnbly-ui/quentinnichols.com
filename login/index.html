<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Private Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <nav class="site-nav" aria-label="Site">
    <div class="nav-shell">
      <details class="nav-menu">
        <summary aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <div class="nav-menu-panel">
          <a href="/">Home</a>
          <a href="/photography/">Photography</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/contact/">Contact</a>
          <a href="https://shop.quentinnichols.com/" target="_blank" rel="noopener">Shop</a>
        </div>
      </details>
      <a class="nav-logo" href="/">
        <img src="/assets/Watermark (1) copy.png" alt="Quentin Nichols">
      </a>
      <div class="nav-spacer" aria-hidden="true"></div>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <p class="auth-kicker">Private Access</p>
      <h1 class="auth-title">Login</h1>
      <p class="auth-copy">Sign in to enter the private side of the site.</p>

      <form class="auth-form" id="login-form">
        <label class="auth-label" for="email">
          Email
          <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </label>

        <label class="auth-label" for="password">
          Password
          <input class="auth-input" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>

        <button class="auth-button" id="login-button" type="submit">Login</button>
        <p class="auth-message" id="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="/assets/auth.js"></script>
  <script src="/assets/nav.js"></script>
  <script>
    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("login-button");
    const message = document.getElementById("message");

    function setMessage(text, state = "") {
      message.innerText = text;
      if (state) {
        message.dataset.state = state;
      } else {
        delete message.dataset.state;
      }
    }

    function setPending(pending) {
      emailInput.disabled = pending;
      passwordInput.disabled = pending;
      loginButton.disabled = pending;
      loginButton.textContent = pending ? "Signing In..." : "Login";
    }

    async function login() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("Enter your email and password to continue.", "error");
        return;
      }

      setMessage("");
      setPending(true);

      try {
        const { data, error } = await window.siteAuth.login(email, password);

        if (error) {
          setMessage(error.message, "error");
          console.log("Login error:", error);
          return;
        }

        console.log("Logged in:", data);
        setMessage("Login successful. Redirecting...", "success");
        window.location.href = "/portal/";
      } catch (error) {
        setMessage("Login failed. Please try again.", "error");
        console.log("Unexpected login error:", error);
      } finally {
        setPending(false);
      }
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      login();
    });

    window.siteAuth.getSession().then((session) => {
      if (session) {
        window.location.href = "/portal/";
      }
    }).catch((error) => {
      console.log("Session lookup failed:", error);
    });
  </script>
</body>
</html>
