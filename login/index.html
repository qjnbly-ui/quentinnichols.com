<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/Favicon32.png" />
<meta name="robots" content="noindex, nofollow">
  <title>Private Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
  <nav class="site-nav" aria-label="Site">
    <div class="nav-shell">
      <details class="nav-menu">
        <summary aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <div class="nav-menu-panel">
          <a href="/">Home</a>
          <a href="/photography/">Photography</a>
          <a href="/projects/">Projects</a>
          <a href="/blog/">Blog</a>
          <a href="/contact/">Contact</a>
        </div>
      </details>
      <a class="nav-logo" href="/">
        <img src="/assets/NEWLOGO.png" alt="Quentin Nichols">
      </a>
      <div class="nav-spacer" aria-hidden="true"></div>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-card">
      <p class="auth-kicker">Private Access</p>
      <h1 class="auth-title">Login</h1>
      <p class="auth-copy">Sign in to enter the private side of the site.</p>

      <form class="auth-form" id="login-form">
        <label class="auth-label" for="email">
          Email
          <input class="auth-input" id="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        </label>

        <label class="auth-label" for="password">
          Password
          <input class="auth-input" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>

        <button class="auth-button" id="login-button" type="submit">Login</button>
        <div class="auth-turnstile-wrap" id="auth-captcha-field">
          <span class="auth-label-text">Security Check</span>
          <div id="auth-turnstile"></div>
          <p class="auth-turnstile-note">Complete this check before signing in.</p>
        </div>
        <p class="auth-message" id="message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script src="/assets/auth.js"></script>
  <script src="/assets/nav.js"></script>
  <script>
    const TURNSTILE_SITE_KEY = "0x4AAAAAADBU943ZPm7X4K8-";

    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("login-button");
    const message = document.getElementById("message");
    const turnstileContainer = document.getElementById("auth-turnstile");
    const nextParam = new URLSearchParams(window.location.search).get("next");

    let captchaToken = "";
    let captchaWidgetId = null;

    function getPostLoginDestination() {
      if (typeof nextParam === "string" && nextParam.startsWith("/")) {
        return nextParam;
      }
      return "/portal/";
    }

    function setMessage(text, state = "") {
      message.innerText = text;
      if (state) {
        message.dataset.state = state;
      } else {
        delete message.dataset.state;
      }
    }

    function setPending(pending) {
      emailInput.disabled = pending;
      passwordInput.disabled = pending;
      loginButton.disabled = pending;
      loginButton.textContent = pending ? "Signing In..." : "Login";
    }

    function resetCaptcha() {
      captchaToken = "";
      if (!window.turnstile || captchaWidgetId === null) return;
      window.turnstile.reset(captchaWidgetId);
    }

    async function waitForTurnstile(maxWaitMs = 5000) {
      const startedAt = Date.now();
      while (!window.turnstile) {
        if (Date.now() - startedAt > maxWaitMs) return false;
        await new Promise((resolve) => window.setTimeout(resolve, 100));
      }
      return true;
    }

    async function initCaptcha() {
      if (!TURNSTILE_SITE_KEY || !turnstileContainer) return;
      const ready = await waitForTurnstile();
      if (!ready) {
        setMessage("Security check failed to load. Refresh and try again.", "error");
        return;
      }

      captchaWidgetId = window.turnstile.render(turnstileContainer, {
        sitekey: TURNSTILE_SITE_KEY,
        callback: (token) => {
          captchaToken = token;
        },
        "expired-callback": () => {
          captchaToken = "";
        },
        "error-callback": () => {
          captchaToken = "";
        },
      });
    }

    async function login() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setMessage("Enter your email and password to continue.", "error");
        return;
      }

      if (!captchaToken) {
        setMessage("Complete the security check first.", "error");
        return;
      }

      setMessage("");
      setPending(true);

      try {
        const { data, error } = await window.siteAuth.login(email, password, captchaToken);

        if (error) {
          resetCaptcha();
          setMessage(error.message, "error");
          console.log("Login error:", error);
          return;
        }

        console.log("Logged in:", data);
        setMessage("Login successful. Redirecting...", "success");
        window.location.href = getPostLoginDestination();
      } catch (error) {
        resetCaptcha();
        setMessage("Login failed. Please try again.", "error");
        console.log("Unexpected login error:", error);
      } finally {
        setPending(false);
      }
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      login();
    });

    window.siteAuth.getSession().then((session) => {
      if (session) {
        window.location.href = getPostLoginDestination();
      }
    }).catch((error) => {
      console.log("Session lookup failed:", error);
    });

    initCaptcha();
  </script>
</body>
</html>
